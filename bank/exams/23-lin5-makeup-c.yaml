- id: 23-lin5-makeup-c-001
  num: 1
  section: 多选题
  type: multi_choice
  stem: 维拉帕米的药理作用
  options:
    A: 抑制钙离子通道
    B: 抑制钾离子通道
    C: 抑制窦房结自律性
    D: 减慢房室结传导
    E: 延长窦房结和房室结的ERP
  completeness: stem_with_hint
  answer: 抑制钙离子通道；抑制窦房结自律性；减慢房室结传导；延长窦房结和房室结ERP
  analysis: “抑制钾通道”非其主要作用
  kp: [ccb, antiarrhythmics]
  status: draft-ai
- id: 23-lin5-makeup-c-002
  num: 2
  section: 多选题
  type: multi_choice
  stem: 硝普钠的作用
  options:
    A: 扩张小动脉静脉
    B: 治疗急性高血压脑病
    C: 治疗难治性心力衰竭
    D: 起效快持久
    E: 久用有硫氰化物沉积
  completeness: stem_with_hint
  answer: 扩张小动脉静脉；治疗急性高血压脑病；治疗难治性心力衰竭；久用有硫氰化物蓄积
  analysis: 起效快但作用短暂，“持久”错
  kp: [antihypertensives_other, heart_failure]
  status: draft-ai
- id: 23-lin5-makeup-c-003
  num: 3
  section: 多选题
  type: multi_choice
  stem: 氨基糖苷类药物不良反应
  completeness: stem_only
  answer: 耳毒性、肾毒性、神经肌肉阻滞、过敏反应
  kp: [aminoglycosides]
  status: draft-ai
- id: 23-lin5-makeup-c-004
  num: 4
  section: 多选题
  type: multi_choice
  stem: 影响细菌核酸代谢
  recall: 有一个选项 乙胺嘧啶
  completeness: stem_with_hint
  answer: 喹诺酮类、利福平（及按口径：乙胺嘧啶通过叶酸代谢间接影响）
  analysis: 见 kp.antibacterial_mechanisms
  kp: [antibacterial_mechanisms, sulfonamides]
  status: draft-ai
- id: 23-lin5-makeup-c-005

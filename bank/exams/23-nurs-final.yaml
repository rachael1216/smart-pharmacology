- id: 23-nurs-final-011
  num: 11
  section: 问答题
  type: essay
  stem: 病例：高血压15年，慢性心力衰竭，双下肢水肿，颈静脉怒张，双肺底湿啰音，心界向左下扩大。首选什么利尿药，说明理由，并试述作用部位和药理机制
  completeness: full
  answer: 首选呋塞米（袢利尿药）。理由：患者有颈静脉怒张、双下肢水肿和双肺底湿啰音，提示体循环与肺循环淤血较重，需要高效、速效利尿；呋塞米静注还能扩张容量静脉，先于利尿减轻肺淤血。作用部位：髓袢升支粗段。
  answer_ref: [loop_diuretics#作用机制, loop_diuretics#心衰伴肺水肿的意义]
  analysis: 病例为慢性心衰急性加重（体循环 + 肺循环淤血），宜首选袢利尿药呋塞米；轻度水肿可选噻嗪类。理由要结合“高效、起效快、扩张容量静脉减轻肺淤血”。
  kp: [loop_diuretics, heart_failure, diuretics_general]
  status: draft-ai

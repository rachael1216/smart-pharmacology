  num: 1
  section: 填空题
  type: fill_blank
  stem: 尼可刹米给家兔注射时的剂量为90mg/kg，现在注射的浓度为25%，2.4kg体重的家兔需注射此种注射液______mL。
  completeness: full
  answer: '0.864'
  analysis: 90×2.4=216 mg；25%=250 mg/ml；216/250
  kp: [lab]
  status: draft-ai

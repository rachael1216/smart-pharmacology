  completeness: full
  answer_ref: [insulin#作用机制, insulin#临床应用指征]
  analysis: 机制写受体酪氨酸激酶→IRS→PI3K/Akt→GLUT4 转位；应用指征 5 条中 1 型糖尿病与急性并发症最重要。

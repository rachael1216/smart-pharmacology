  section: 名词解释
  type: definition
  stem: 负性频率作用
  completeness: full
  answer: 负性频率作用：治疗量强心苷使心功能不全患者心率减慢的作用。机制：①增强心肌收缩力、增加心输出量，经颈动脉窦/主动脉弓压力感受器反射性降低交感张力、增强迷走张力；②直接增敏窦房结对乙酰胆碱的反应。心率减慢延长舒张期，有利于冠脉灌流和静脉回流。
  answer_ref: [cardiac_glycosides#药理作用]
  analysis: 名解。负性频率作用指强心苷减慢心率的作用。
  kp: [cardiac_glycosides]
  status: draft-ai

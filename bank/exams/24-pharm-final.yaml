- id: 24-pharm-final-019
  num: 19
  section: 简答题
  type: short_answer
  stem: 简述下列现象的药理机制
  sub:
  - 青霉素过敏时引起的低血压的可用肾上腺素解救，而氯丙嗪引起的低血压禁忌使用肾上腺素
  - 长期单用β受体激动药治疗哮喘一段时间后疗效下降，联用糖皮质激素可延长其作用时间
  - 服用碳酸氢钠可加速阿司匹林从尿液中排出
  - 洛哌丁胺和奎尼丁联用时会引起严重的中枢呼吸抑制。
  completeness: full
  answer_ref:
  - adr_reversal#现象解释（24药学简答）
  - glucocorticoids#与β₂激动药合用
  - pKa_ion_trapping#评分要点
  - drug_interaction#洛哌丁胺+奎尼丁（24药学）
  analysis: 四个小问分别对应：肾上腺素升压作用翻转（α 阻断）、β₂ 受体下调与糖皮质激素的允许/增敏作用、离子障与尿液 pH、P-gp 抑制使外周阿片药入脑。每问 1 分，写出机制关键词即可得分。
  kp: [adr_reversal, glucocorticoids, antiasthma, pKa_ion_trapping, drug_interaction]
  status: draft-ai
- id: 24-pharm-final-020
  num: 20
  section: 简答题
  type: short_answer
  stem: 解救急性有机磷酸酯类中毒时，为什么必须同时使用阿托品和碘解磷定？
  completeness: full
  answer_ref: [op_poisoning#为何必须合用, op_poisoning#解毒药及机制]
  analysis: 核心：阿托品只对 M 样症状有效、不能复活酶；解磷定复活 AChE 并缓解 N 样症状，但对 M 样症状弱。作用互补。
  kp: [op_poisoning, atropine]
  status: draft-ai

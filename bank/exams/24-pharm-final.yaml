  answer_ref: [loop_diuretics#作用机制, loop_diuretics#临床应用]
  analysis: 举呋塞米即可。作用位点“髓袢升支粗段”、分子靶点“Na⁺-K⁺-2Cl⁻ 同向转运体”是必得分点。
